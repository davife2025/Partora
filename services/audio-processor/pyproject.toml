[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "partora-audio-processor"
version = "0.1.0"
description = "Partora audio analysis microservice — Demucs + Basic Pitch"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "demucs>=4.0.1",
  "basic-pitch>=0.3.5",
  "librosa>=0.10.2",
  "numpy>=1.26.0",
  "soundfile>=0.12.1",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]
