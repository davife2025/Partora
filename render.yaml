services:
  # ── Node.js API ─────────────────────────────────────────────────
  - type: web
    name: partora-api
    env: node
    region: oregon
    plan: starter
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: AUDIO_PROCESSOR_URL
        fromService:
          name: partora-audio-processor
          type: web
          envVarKey: RENDER_INTERNAL_HOSTNAME
      - key: REDIS_HOST
        fromService:
          name: partora-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: partora-redis
          type: redis
          property: port
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_SOPRANO
        sync: false
      - key: ELEVENLABS_VOICE_ALTO
        sync: false
      - key: ELEVENLABS_VOICE_TENOR
        sync: false
      - key: ELEVENLABS_VOICE_BASS
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: HUGGINGFACE_MODEL_ID
        value: moonshotai/Kimi-K2.6
      - key: AUDD_API_TOKEN
        sync: false
      - key: API_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  # ── Python Audio Processor ──────────────────────────────────────
  - type: web
    name: partora-audio-processor
    env: docker
    region: oregon
    plan: standard          # needs more RAM for Demucs model weights (~2 GB)
    rootDir: services/audio-processor
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: AUDIO_PROCESSOR_PORT
        value: 5001

  # ── Redis ────────────────────────────────────────────────────────
  - type: redis
    name: partora-redis
    plan: starter
    maxmemoryPolicy: noeviction
